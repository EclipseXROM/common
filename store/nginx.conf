server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    autoindex off;

    location = /catalog.json { add_header Cache-Control "no-cache"; }
    location = /catalog.sig  { add_header Cache-Control "no-cache"; }
    location /apk/ { types { application/vnd.android.package-archive apk; } add_header Cache-Control "public, max-age=3600"; }
    location /icons/ { add_header Cache-Control "public, max-age=86400"; }
    location / { try_files $uri =404; }

    add_header X-Content-Type-Options nosniff always;
}
