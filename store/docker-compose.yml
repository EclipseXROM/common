# Manikineko Store backend: static files only (catalog.json + catalog.sig + apk/ + icons/), served on :8097.
# TLS is terminated in front (Nginx Proxy Manager / Cloudflare) -> https://apps.zyghosting.online
# Content is produced and SIGNED on the dev machine (scripts/80-store-publish.py); the signing key never lives on this server.
services:
  web:
    image: nginx:1.27-alpine
    container_name: manikineko-store
    restart: unless-stopped
    ports:
      - "8097:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/catalog.json"]
      interval: 60s
      timeout: 5s
      retries: 3
